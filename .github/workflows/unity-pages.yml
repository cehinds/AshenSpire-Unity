name: Unity checkpoint and Pages
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, test, release, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: unity-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'channels' }}
  cancel-in-progress: false
jobs:
  validate-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic Unity rules
        run: dotnet run --project UnityTests/Domain
      - name: Compare native foundations with the original engine
        run: |
          dotnet run --project UnityTests/Parity
          python3 UnityTests/Parity/authoring-checks.py
          dotnet run --project UnityTests/NativeFeedback
          dotnet run --project UnityTests/CardText
          dotnet run --project UnityTests/CardCosts
          dotnet run --project UnityTests/SpriteStyles
          dotnet run --project UnityTests/MapShape
          dotnet run --project UnityTests/MapKnowledge
          dotnet run --project UnityTests/MapViewport
          dotnet run --project UnityTests/CoopRun
          dotnet run --project UnityTests/CoopRun -- --policy
          dotnet run --project UnityTests/Playthrough -- 3 TestResults/NativePolicy
      - name: Verify cooperative host authority, persistence and packaging guards
        run: |
          dotnet build tools/NativeLan/Companion/AshenSpire.Companion.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/Checks/TransportChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/NativeChecks/NativeChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/PersistenceChecks/PersistenceChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/StartingChoicesChecks/StartingChoicesChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/CommandGateChecks/CommandGateChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/PanelStateChecks/PanelStateChecks.csproj -c Release
          python3 tools/validate-companion.test.py
          python3 tools/validate-unity-targets.test.py
      - name: Test authoring file transactions and asset validation
        run: dotnet run --project UnityTests/Authoring -- TestResults/Authoring/checks.json
      - name: Test displayed viewport sizing
        run: dotnet run --project UnityTests/Viewport
      - name: Test Web renderer staging bounds and patch guards
        run: dotnet run --project UnityTests/RendererPatch
      - name: Test interruption state and browser listener lifecycle
        run: |
          dotnet run --project UnityTests/Interruption
          node tools/browser-visibility.test.cjs
          node tools/control-report.test.cjs
      - name: Exercise fixed campaign policies
        run: |
          mkdir -p TestResults/Balance
          dotnet run --project UnityTests/Balance -- GameContent/Unity/campaign.json TestResults/Balance/campaign.json
      - name: Verify packaged player matches its source
        run: node tools/unity-package.mjs --check
      - name: Verify immutable build history and channel membership
        run: node tools/unity-build-history.test.mjs
      - name: Verify bounded Pages artifact copying
        run: node tools/unity-git-blobs.test.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the packaged player server
        run: python3 -m http.server 8787 --bind 127.0.0.1 --directory Published/Web > /tmp/ashenspire-preview.log 2>&1 &
      - name: Exercise feedback preferences and interruption
        run: node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Feedback --feedback-only
      - name: Exercise original foundation controls and compiled map parity
        run: node tools/foundation-playtest.cjs http://127.0.0.1:8787 TestResults/Foundation
      - name: Exercise actual browser hiding and explicit return
        run: node tools/interruption-playtest.cjs http://127.0.0.1:8787 TestResults/Interruption
      - name: Exercise seed editing and rotation at phone pixel density
        run: node tools/interruption-playtest.cjs http://127.0.0.1:8787 TestResults/Seed --seed-only
      - name: Exercise dense mobile layout with touch input
        run: node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Mobile --dpr 3 --touch --mobile-layout --landscape-repeats 3
      - name: Complete the native three-act climb with reloads
        run: node tools/native-playtest.cjs http://127.0.0.1:8787 TestResults/NativeBrowser
      - name: Verify card numbers and resource shortage feedback
        run: node tools/native-card-cost-playtest.cjs http://127.0.0.1:8787 TestResults/NativeCardCosts
      - name: Exercise native draft, level-up, flask allocation and merchant transactions
        run: node tools/native-features-playtest.cjs http://127.0.0.1:8787 TestResults/NativeFeatures
      - name: Verify original sprite styles and saved appearance through actual controls
        run: node tools/native-appearance-playtest.cjs http://127.0.0.1:8787 TestResults/NativeAppearance
      - name: Verify painted enemies through target selection and combat
        run: node tools/native-enemy-art-playtest.cjs http://127.0.0.1:8787 TestResults/NativeEnemyArt
      - name: Exercise custom map caps and weights through actual controls
        run: node tools/native-map-shape-playtest.cjs http://127.0.0.1:8787 TestResults/NativeMapShape
      - name: Exercise branching maps, fog, camera restoration and touch navigation
        run: node tools/native-map-playtest.cjs http://127.0.0.1:8787 TestResults/NativeMap
      - name: Complete an actual two-player Unity fight and rejoin
        run: node tools/native-coop-ci.cjs TestResults/NativeCoopBrowser
      - name: Exercise the packaged game with real pointer input
        run: |
          node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Browser --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            TestResults/Browser
            TestResults/Feedback
            TestResults/Authoring
            TestResults/Balance
            TestResults/Mobile
            TestResults/Interruption
            TestResults/Seed
            TestResults/Foundation
            TestResults/NativeBrowser
            TestResults/NativePolicy
            TestResults/NativeFeedback
            TestResults/CardText
            TestResults/NativeFeatures
            TestResults/NativeCardCosts
            TestResults/NativeCoopBrowser
            TestResults/NativeAppearance
            TestResults/NativeEnemyArt
            TestResults/NativeMapShape
            TestResults/NativeMap
      - name: Refresh channel refs
        if: github.event_name != 'pull_request'
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Assemble all channels together
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/unity-pages.mjs
          node tools/unity-pages-links.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-and-assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish all four channel pages
        id: deployment
        uses: actions/deploy-pages@v4
