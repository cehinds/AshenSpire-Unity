name: Unity checkpoint and Pages
on:
  # Docs-only changes cannot alter the packaged player or any check below, so
  # they skip this pipeline. A change touching any other file still runs all of it.
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [dev, test, release, main, "codex/**"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_library_only:
        description: Publish committed build history with archive integrity checks (does not assert game CI passed)
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  # A new commit on a pull request supersedes the older run; push runs (which
  # feed the Pages library) keep one group per commit and are never cancelled.
  group: ${{ github.event_name == 'pull_request' && format('unity-checkpoint-pr-{0}', github.event.pull_request.number) || format('unity-checkpoint-{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The checks used to run as one serial ~2h20m job. They now run as parallel
# jobs; `validate-and-assemble` keeps its name as the single check that passes
# only when every part passed.
jobs:
  parity:
    if: ${{ !inputs.publish_library_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare native foundations with the original engine
        run: |
          dotnet run --project UnityTests/Parity
          python3 UnityTests/Parity/authoring-checks.py
          dotnet run --project UnityTests/NativeFeedback
          dotnet run --project UnityTests/CardText
          dotnet run --project UnityTests/CardCosts
          dotnet run --project UnityTests/SpriteStyles
          dotnet run --project UnityTests/MapShape
          dotnet run --project UnityTests/MapKnowledge
          dotnet run --project UnityTests/MapViewport
          dotnet run --project UnityTests/CoopRun
          dotnet run --project UnityTests/CoopRun -- --policy
          dotnet run --project UnityTests/Playthrough -- 3 TestResults/NativePolicy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-parity
          path: |
            TestResults/NativePolicy
            TestResults/NativeFeedback
            TestResults/CardText
          if-no-files-found: ignore

  checks:
    if: ${{ !inputs.publish_library_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic Unity rules
        run: dotnet run --project UnityTests/Domain
      - name: Verify cooperative host authority, persistence and packaging guards
        run: |
          dotnet build tools/NativeLan/Companion/AshenSpire.Companion.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/Checks/TransportChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/NativeChecks/NativeChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/PersistenceChecks/PersistenceChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/StartingChoicesChecks/StartingChoicesChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/CommandGateChecks/CommandGateChecks.csproj -c Release
          dotnet run --project tools/NativeLan/Tests/PanelStateChecks/PanelStateChecks.csproj -c Release
          python3 tools/validate-companion.test.py
          python3 tools/validate-unity-targets.test.py
      - name: Test authoring file transactions and asset validation
        run: dotnet run --project UnityTests/Authoring -- TestResults/Authoring/checks.json
      - name: Test displayed viewport sizing
        run: dotnet run --project UnityTests/Viewport
      - name: Test Web renderer staging bounds and patch guards
        run: dotnet run --project UnityTests/RendererPatch
      - name: Test interruption state and browser listener lifecycle
        run: |
          dotnet run --project UnityTests/Interruption
          node tools/browser-visibility.test.cjs
          node tools/control-report.test.cjs
          node --test tools/native-ui-driver.test.cjs
      - name: Exercise fixed campaign policies
        run: |
          mkdir -p TestResults/Balance
          dotnet run --project UnityTests/Balance -- GameContent/Unity/campaign.json TestResults/Balance/campaign.json
      - name: Test cross-platform Unity source digest ordering
        run: node --test tools/unity-source-digest.test.mjs
      - name: Verify packaged player matches its source
        run: node tools/unity-package.mjs --check
      - name: Verify immutable build history and channel membership
        run: node tools/unity-build-history.test.mjs
      - name: Verify shared channel runtime and evidence storage
        run: node tools/unity-channel-storage.test.mjs
      - name: Verify immutable archive hosting
        run: node tools/unity-archive-hosting.test.mjs
      - name: Verify bounded Pages artifact copying
        run: node tools/unity-git-blobs.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-checks
          path: |
            TestResults/Authoring
            TestResults/Balance
          if-no-files-found: ignore

  # Browser playtests drive the packaged WebGL player under software rendering
  # and dominate the wall clock. Shards are balanced by measured step times
  # (runs 36051894484 and 36065296538) to under ~30 minutes each; `coop` also builds the companion host.
  playtests:
    if: ${{ !inputs.publish_library_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: climb
            run: |
              node tools/native-playtest.cjs http://127.0.0.1:8787 TestResults/NativeBrowser
          - shard: features
            run: |
              node tools/native-features-playtest.cjs http://127.0.0.1:8787 TestResults/NativeFeatures
              node tools/native-card-cost-playtest.cjs http://127.0.0.1:8787 TestResults/NativeCardCosts
              node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Feedback --feedback-only
              node tools/foundation-playtest.cjs http://127.0.0.1:8787 TestResults/Foundation
              node tools/interruption-playtest.cjs http://127.0.0.1:8787 TestResults/Seed --seed-only
          - shard: appearance
            run: |
              node tools/native-appearance-playtest.cjs http://127.0.0.1:8787 TestResults/NativeAppearance
              node tools/native-map-shape-playtest.cjs http://127.0.0.1:8787 TestResults/NativeMapShape
          - shard: layout
            run: |
              node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Mobile --dpr 3 --touch --mobile-layout --landscape-repeats 3
              node tools/native-enemy-art-playtest.cjs http://127.0.0.1:8787 TestResults/NativeEnemyArt
              node tools/interruption-playtest.cjs http://127.0.0.1:8787 TestResults/Interruption
          - shard: coop
            companion: true
            run: |
              node tools/native-coop-ci.cjs TestResults/NativeCoopBrowser
              node tools/native-map-playtest.cjs http://127.0.0.1:8787 TestResults/NativeMap
              node tools/campaign-playtest.cjs http://127.0.0.1:8787 TestResults/Browser --full
    name: playtests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: ${{ matrix.companion }}
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the cooperative companion host
        if: ${{ matrix.companion }}
        run: dotnet build tools/NativeLan/Companion/AshenSpire.Companion.csproj -c Release
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the packaged player server
        run: python3 -m http.server 8787 --bind 127.0.0.1 --directory Published/Web > /tmp/ashenspire-preview.log 2>&1 &
      - name: Run ${{ matrix.shard }} playtests
        run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.shard }}
          path: TestResults
          if-no-files-found: ignore

  validate-and-assemble:
    needs: [parity, checks, playtests]
    # !cancelled(): a run superseded by a newer push reports nothing rather
    # than a red check; a failed part still reaches this job and fails it.
    if: ${{ !cancelled() && !inputs.publish_library_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "parity=${{ needs.parity.result }} checks=${{ needs.checks.result }} playtests=${{ needs.playtests.result }}"
          for r in "${{ needs.parity.result }}" "${{ needs.checks.result }}" "${{ needs.playtests.result }}"; do
            [ "$r" = success ] || exit 1
          done
  publish-library:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_library_only }}
    permissions:
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    uses: ./.github/workflows/unity-build-library.yml
